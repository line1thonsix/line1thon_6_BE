# 테스트는 로컬 MySQL 없이 H2 인메모리 DB로 실행
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:team6;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트는 실제 AI를 부르지 않는다. 로컬에 GEMINI_API_KEY가 있어도 가짜 클라이언트를 쓴다
deveil.ai.api-key=
# 질문 생성 테스트가 PREPARING 상태를 확인하므로 리스너는 끈다. 선생성 흐름 테스트에서만 켠다
deveil.ai.listener-enabled=false
