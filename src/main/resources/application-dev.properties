# DB 계정은 config/application-local.properties에 작성 (git과 jar에 포함되지 않음)
spring.config.import=optional:file:./config/application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/team6?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
