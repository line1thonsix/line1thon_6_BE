spring.application.name=team6

# 프로필을 지정하지 않으면 dev로 실행 (운영은 SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev

# 웹 요청이 끝날 때까지 DB 커넥션을 잡지 않음
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 모든 로그 줄에 requestId를 붙임 (RequestIdFilter가 MDC에 넣은 값, 오류 응답의 requestId와 같음)
logging.pattern.level=%5p [%X{requestId:-}]

# AI 호출 (AI 담당 전달 명세 R4). 키는 환경변수 GEMINI_API_KEY로만 받는다.
# 키가 비어 있으면 고정 응답을 돌려주는 가짜 클라이언트를 쓴다 (로컬에서 키 없이 흐름 확인용)
deveil.ai.api-key=${GEMINI_API_KEY:}
deveil.ai.model=${DEVEIL_MODEL:gemini-2.5-flash}
deveil.ai.base-url=https://generativelanguage.googleapis.com/v1beta
deveil.ai.timeout=15s
deveil.ai.temperature=0.2
# 생각 토큰 상한. 제한하지 않으면 최대 출력 토큰을 생각에 다 써서 JSON이 잘린다 (11/9 실측)
deveil.ai.thinking-budget=512
# 형식 오류 시 첫 호출 포함 최대 호출 수 (R5)
deveil.ai.max-attempts=3
# 커밋 후 선생성 리스너 실행 여부. 테스트는 기본으로 끈다
deveil.ai.listener-enabled=true

# CORS: 요청을 허용할 프론트 주소 (쉼표로 구분). 배포하면 환경변수 CORS_ALLOWED_ORIGINS로 배포 주소를 넣는다
deveil.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
