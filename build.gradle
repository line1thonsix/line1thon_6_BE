plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.line1thon'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// API 문서 (Swagger UI: /swagger-ui/index.html). Spring Boot 4는 springdoc 3.x가 필요
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 예전 위치에 남은 로컬 계정 파일이 jar에 들어가지 않도록 제외
tasks.named('processResources') {
	exclude 'application-local.properties'
}

// 배포(Railway)는 build/libs/app.jar 하나만 실행한다 (Railway 서비스 설정의 실행 명령: java -jar build/libs/app.jar)
// 실행할 수 없는 -plain.jar는 만들지 않고, 실행 jar 이름은 버전과 상관없이 고정
tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('test') {
	useJUnitPlatform()
}
